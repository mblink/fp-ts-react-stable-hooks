name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    name: Build, test and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run prepublishOnly

  compat:
    name: Compatibility (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # @testing-library/react needs React 18+, so older React versions are covered by the peer range only.
          - name: React 18
            install: react@18 react-dom@18
            run: npx jest --ci --silent
          # Lowest fp-ts that has the top-level module paths (`fp-ts/Eq`) used by src/.
          - name: fp-ts 2.8.0 floor
            install: fp-ts@2.8.0
            run: npx tsc -p tsconfig.json --noEmit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm install --no-save ${{ matrix.install }}
      - run: ${{ matrix.run }}
